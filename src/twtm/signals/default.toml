# 訊號與研究參數（mvp-spec-v1.2 §4、§4A、§4B）。
# 修改任何系列的參數，都要同時升級該系列的 version；
# 研究報告與 signal_event 會記錄使用的版本，舊版設定檔另存凍結（例如 gap-v1.toml）。

[common]
atr_n = 20                 # ATR 天數

[high_zone]
lookback = 60              # 高低區間天數（至 t-1）
quantile = 0.8             # 收盤位於區間上方 20%
near_high = 0.05           # 或距區間最高價 5% 以內

# ---------- 高檔跳空向下 ----------
[gap]
version = "gap-v2"         # v2：量能改用百分位門檻
size_bins = [0.5, 1.0]     # 跳空幅度分組（ATR）：<0.5、0.5–1、>=1
unfilled_days = [3, 5]     # 缺口未回補天數
volume_n = 20              # 均量天數（至 t-1）
volume_mode = "percentile" # 量比在過去 volume_lookback 日中的百分位 >= volume_pct
volume_lookback = 750      # 約 3 年
volume_pct = 0.8

[intl]
symbol = "^SOX"
atr_mult = 1.5             # 前一美股交易日報酬 <= -1.5 倍 ATR%
ma = 20                    # 或收盤 < 20 日均線

# ---------- 跌破均線系列 ----------
[ma]
version = "ma-v1"
windows = [5, 10, 20]      # 跌破 N 日線
hold_days = 3              # 跌破後連續 N 日站不回
slope_days = 3             # 20 日線下彎：今天 < N 日前
down_streak = 3            # 連續收低天數
uptrend_long = 60          # 「多頭中」：t-1 的 20 日線 > 60 日線

# ---------- 假突破 ----------
[breakout]
version = "fb-v1"
lookback = 60              # 「創高」＝突破前 60 日最高價
lookback_long = 250        # 長期版：前 250 日最高價
fail_days = 3              # 收盤突破後 N 日內收回突破前高點以下 → 突破失敗
retest_gap = 10            # 二次創高：被突破的高點至少是 N 日前形成
retest_pullback_atr = 2.0  # 且之間曾回落 >= 2 ATR
gap_within = 10            # 假突破後 N 日內出現向下跳空

# ---------- 研究方法 ----------
[research]
version = "research-v2"    # v2：主要判定改為「20 日內大回檔機率」
verdict_metric = "drawdown"
horizons = [1, 3, 5, 10, 20]
mae_days = 20              # 回檔觀察天數
dd_atr = 4.0               # 主要：20 日內最低價 <= 訊號日收盤 − 4 ATR（基準約 26–30%）
dd_pct = 0.05              # 輔助：20 日內回檔 >= 5%
decluster_days = 20        # 去除後續 20 日內的重複訊號
min_events = 15            # 少於此數只列出、不下結論
split_date = "2019-01-01"  # 探索期 / 驗證期
bootstrap = 5000
seed = 20261112

# ---------- 價格趨勢轉弱程度（風險分數，價格類別） ----------
[risk]
version = "pw-v1"
# 三個狀態（每日收盤判斷）：
#   A 跌破 20 日線後站不回：收盤連續 hold_days 日在 20 日線之下（M4 的持續版）
#   B 5 日線在 20 日線之下（M5 的持續版）
#   C 20 日線下彎：20 日線 < slope_days 日前（M6 的持續版）
hold_days = 3
slope_days = 3
persist_days = 5           # 「趨勢惡化」：A、B、C 同時成立連續 5 日

# ---------- 減碼回測 ----------
[backtest]
version = "bt-v1"
initial_weights = [0.8, 0.7, 0.6]   # 初步轉弱時的持股比例
strong_weights = [0.6, 0.4, 0.2]    # 明顯轉弱（含趨勢惡化）時的持股比例
restore_rules = ["score3", "above_ma20", "above_ma20_ma5up"]
restore_days = 3                    # score3：轉弱程度連續 3 日低於目前減碼層級
cost = 0.003                        # 每次調整：調整比例 × 單邊成本
cost_sensitivity = [0.001, 0.005]
fixed_weight = 0.7                  # 比較基準：全程固定持股
ma_rule_window = 60                 # 比較基準：跌破 60 日線減碼
selection_end = "2019-01-01"        # 選參期 2005–2018；之後只用來檢驗
selection_metric = "calmar"         # 選參規則：選參期 年化報酬 / 最大回撤 最高者
random_sims = 1000
seed = 20261113
stress_drawdown = 0.15              # 大跌段：加權從高點回落 >= 15%
