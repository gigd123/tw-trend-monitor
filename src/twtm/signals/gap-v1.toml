# 凍結版：重現 reports/gap-v1/ 的研究結果用。不要修改。
# twtm research gaps --config src/twtm/signals/gap-v1.toml

[common]
atr_n = 20

[high_zone]
lookback = 60
quantile = 0.8
near_high = 0.05

[gap]
version = "gap-v1"
size_bins = [0.5, 1.0]
unfilled_days = [3, 5]
volume_n = 20
volume_mode = "ratio"      # 量比 >= volume_ratio
volume_ratio = 1.5

[intl]
symbol = "^SOX"
atr_mult = 1.5
ma = 20

[research]
version = "research-v1"
data_end = "2026-11-11"     # 研究資料截止日；之後保留給前向紀錄
verdict_metric = "returns"   # 以 5 日、20 日平均報酬判定
horizons = [1, 3, 5, 10, 20]
mae_days = 20
decluster_days = 20
min_events = 15
split_date = "2019-01-01"
bootstrap = 5000
seed = 20261112
dd_atr = 4.0
dd_pct = 0.05
